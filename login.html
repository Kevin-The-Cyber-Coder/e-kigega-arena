<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple inventory system for products and stock.">
  <title>Log in · Simple Inventory</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/main.js" defer></script>
</head>
<body>


<main class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">SI</span>
    </div>

    <h1>Simple Inventory</h1>
    <p class="login-intro">Log in to manage products and keep track of stock.</p>

    


    

    <form action="/login" method="POST" class="stack">
      <label>
        Email
        <input
          type="email"
          name="email"
          value=""
          autocomplete="email"
          placeholder="you@example.com"
          required
          autofocus
        >
      </label>

      <label>
        Password
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          placeholder="Your password"
          required
        >
      </label>

      <button type="submit" class="button primary wide">Log in</button>
    </form>

    <p class="login-help">Use the account your admin created for you.</p>
  </section>
</main>

<footer class="footer">
  <div class="shell">Simple Inventory &middot; A small Node.js, MongoDB and EJS project</div>
</footer>
</body>
</html>
